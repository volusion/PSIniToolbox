name: CI

on:
  pull_request:
    branches:
    - main

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install PSScriptAnalyzer
      shell: pwsh
      run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery

    - name: Analyze src
      shell: pwsh
      run: |
        $results = Invoke-ScriptAnalyzer -Path ./src -Recurse
        $results | Format-Table -AutoSize
        $errors = @($results | Where-Object Severity -eq 'Error')
        if ($errors.Count -gt 0) {
            throw "PSScriptAnalyzer found $($errors.Count) error(s)."
        }

  test:
    name: Pester
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Pester
      shell: pwsh
      run: Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -Repository PSGallery

    - name: Run tests with coverage
      shell: pwsh
      run: ./Invoke-Tests.ps1 -Coverage -Output Detailed

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage.xml
