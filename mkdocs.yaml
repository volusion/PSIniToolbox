site_name: PSIniToolbox
site_description: Parse, edit, and write INI configuration files in PowerShell while preserving comments and layout.
site_url: https://volusion.github.io/PSIniToolbox/
repo_name: volusion/PSIniToolbox
repo_url: https://github.com/volusion/PSIniToolbox
edit_uri: ""

# Markdown is generated by ./Build-Docs.ps1 (PlatyPS) and is not committed.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
